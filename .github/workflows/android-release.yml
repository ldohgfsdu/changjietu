name: Android verify and publish

on:
  push:
    branches:
      - master
      - "fix/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version from app/build.gradle.kts (master only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$sdkmanager_bin"
          compile_sdk=$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          build_tools=$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          [[ -n "$compile_sdk" && -n "$build_tools" ]] || { echo "::error::Cannot read compileSdk/buildToolsVersion from app/build.gradle.kts"; exit 1; }
          "$sdkmanager_bin" "platforms;android-$compile_sdk" "build-tools;$build_tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/aapt2
          echo "BUILD_TOOLS_VERSION=$build_tools" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Full debug lint, unit tests, debug build, and release vital lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:lintVitalRelease --no-daemon
      - name: Required bounded formal verification and negative controls
        run: bash formal/longshot/verify.sh
      - name: Print full lint report on failure
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [[ -f "$report" ]]; then cat "$report"; fi

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/master' &&
        ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
         (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]'))))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$sdkmanager_bin"
          compile_sdk=$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          build_tools=$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          [[ -n "$compile_sdk" && -n "$build_tools" ]] || { echo "::error::Cannot read compileSdk/buildToolsVersion from app/build.gradle.kts"; exit 1; }
          "$sdkmanager_bin" "platforms;android-$compile_sdk" "build-tools;$build_tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/aapt2
          echo "BUILD_TOOLS_VERSION=$build_tools" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release version and determine previous signed version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid versionName"; exit 1; }
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::Tag and Gradle versionName differ"; exit 1; }
            git fetch origin master
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::Release tag is not based on master"; exit 1; }
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to replace it."
            exit 1
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)] | sort_by(.created_at) | last | .tag_name // empty')
          [[ "$previous" != "$tag" && -n "$previous" ]] || { echo "::error::Invalid previous release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=changjietu-$version-release.apk" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release $tag (versionCode=$code) follows $previous"
      - name: Enforce authored Chinese changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          file="docs/releases/v$RELEASE_VERSION.md"
          [[ -s "$file" ]] || { echo "::error::Missing changelog $file"; exit 1; }
          for heading in "## 新增" "## 修复" "## 验证" "## 已知限制"; do
            grep -Fqx "$heading" "$file" || { echo "::error::Missing heading: $heading"; exit 1; }
          done
          [[ $(wc -c < "$file") -ge 260 ]] || { echo "::error::Changelog is too short"; exit 1; }
      - name: Load original signing identity
        env:
          KEYSTORE_B64: ${{ secrets.CHANGJIETU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHANGJIETU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHANGJIETU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHANGJIETU_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are absent; refusing debug-key fallback."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/changjietu-release.jks"
          echo "CHANGJIETU_RELEASE_STORE_FILE=$RUNNER_TEMP/changjietu-release.jks" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Signed release build
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --no-daemon
      - name: Verify signature continuity and produce SHA-256 asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          RELEASE_CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" --pattern "changjietu-*-release.apk" --dir "$RUNNER_TEMP/previous"
          old_apks=("$RUNNER_TEMP"/previous/changjietu-*-release.apk)
          [[ ${#old_apks[@]} -eq 1 && -f "${old_apks[0]}" ]] || { echo "::error::Expected exactly one previous signed APK"; exit 1; }
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          aapt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          old_code=$("$aapt" dump badging "${old_apks[0]}" | sed -nE "s/^package:.* versionCode='([0-9]+)'.*/\1/p" | head -n1)
          [[ -n "$old_code" ]] || { echo "::error::Cannot read previous APK versionCode"; exit 1; }
          if (( RELEASE_CODE <= old_code )); then
            echo "::error::versionCode must increase: previous=$old_code, new=$RELEASE_CODE"
            exit 1
          fi
          "$signer" verify "${old_apks[0]}"
          "$signer" verify app/build/outputs/apk/release/app-release.apk
          old_cert=$("$signer" verify --print-certs "${old_apks[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ -n "$old_cert" && "$old_cert" == "$new_cert" ]] || { echo "::error::Signing certificate mismatch"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          sha256sum --check "$APK_NAME.sha256"
      - name: Upload to draft Release, verify remote assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed upload, checksum, signature or download must not expose a public Release.
          notes_file="$RUNNER_TEMP/release-notes.md"
          cp "docs/releases/v$RELEASE_VERSION.md" "$notes_file"
          {
            echo
            echo "## 安装包与构建校验"
            printf -- '- APK：%s（%s 字节）\n' "$APK_NAME" "$(stat -c %s "$APK_NAME")"
            printf -- '- SHA-256：%s\n' "$(cut -d ' ' -f 1 "$APK_NAME.sha256")"
            echo "- 门禁：单测、Lint、状态机验证、签名连续性、远端下载与哈希回读"
          } >> "$notes_file"
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" "$APK_NAME.sha256" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "changjietu $RELEASE_VERSION" \
            --notes-file "$notes_file"
          remote_dir="$RUNNER_TEMP/release-readback"
          mkdir -p "$remote_dir"
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir "$remote_dir"
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME.sha256" --dir "$remote_dir"
          cmp "$APK_NAME.sha256" "$remote_dir/$APK_NAME.sha256"
          cmp "$APK_NAME" "$remote_dir/$APK_NAME"
          (cd "$remote_dir" && sha256sum --check "$APK_NAME.sha256")
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$signer" verify --print-certs "$remote_dir/$APK_NAME"
          local_cert=$("$signer" verify --print-certs "$APK_NAME" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          remote_cert=$("$signer" verify --print-certs "$remote_dir/$APK_NAME" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          [[ -n "$local_cert" && "$local_cert" == "$remote_cert" ]] || {
            echo "::error::Read-back signer differs from validated local signer"; exit 1;
          }
          asset_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          [[ "$asset_count" == "2" ]] || {
            echo "::error::Draft Release does not have exactly the APK and checksum assets"; exit 1;
          }
          gh release edit "$RELEASE_TAG" --draft=false
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "false" ]] || {
            echo "::error::Release did not become public"; exit 1;
          }
          echo "Published $RELEASE_TAG after verified remote APK read-back."
