name: Formal state-machine verification

on:
  push:
    branches: [master, "formal/**", "fix/**"]
    paths:
      - "formal/longshot/**"
      - ".cursor/skills/verify-longshot-*/**"
      - "app/src/main/java/**"
      - ".github/workflows/formal-verification.yml"
  pull_request:
    branches: [master]
    paths:
      - "formal/longshot/**"
      - ".cursor/skills/verify-longshot-*/**"
      - "app/src/main/java/**"
      - ".github/workflows/formal-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Run TLC models and negative-control mutations
        run: bash formal/longshot/verify.sh
