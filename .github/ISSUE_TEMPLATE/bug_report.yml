name: "Bug 报告"
description: "长截图处理器错误、异常、裁切/导出/分享问题"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量写清复现步骤。不要粘贴私有照片、Cookie、Token 或个人隐私。
        来自酷安集中反馈帖的评论由内部接收器建单，无需酷友自行访问私有仓库。
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: "例如 0.2.8"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与系统
      placeholder: "手机型号 / Android 版本"
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 打开... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或录屏（已脱敏）
      description: "可贴附件或安全的链接"
    validations:
      required: false
