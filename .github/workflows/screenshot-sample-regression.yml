name: Screenshot geometry regression (nightly)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-geometry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geometry-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          if [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" &&
                -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            echo "Android SDK packages are already present; skipping sdkmanager refresh."
          else
            sdkmanager_bin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
            test -x "$sdkmanager_bin"
            "$sdkmanager_bin" "platforms;android-35" "build-tools;35.0.0"
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/aapt2
      - uses: gradle/actions/setup-gradle@v6
      - name: Run v0.2.10-compatible seam, crop, and pixel-coverage regressions
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.changjietu.app.image.analysis.SplitPointDetectorEnergyTest' \
            --tests 'com.changjietu.app.image.analysis.SplitPointDetectorUnsafeSeamTest' \
            --tests 'com.changjietu.app.core.SafeCropMarginsTest' \
            --tests 'com.changjietu.app.image.processing.SliceGeometryTest' \
            --no-daemon --stacktrace
      - name: Archive regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-regression-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
