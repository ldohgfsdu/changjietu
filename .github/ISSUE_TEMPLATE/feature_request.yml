name: "功能建议"
description: "关于长截图处理器的体验、交互或功能改进"
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说明实际使用场景与希望解决的问题；不需要先指定技术方案。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      placeholder: "现在完成什么任务不方便？"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的效果
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 现有替代做法
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 参考截图或补充说明
      description: "请先处理隐私"
    validations:
      required: false
