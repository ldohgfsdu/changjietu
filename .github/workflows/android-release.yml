name: Android verify and publish

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/aapt2
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug build and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon

  publish:
    if: github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[publish-v0.2.1]')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew tools/aapt2
      - uses: gradle/actions/setup-gradle@v4
      - name: Require existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.CHANGJIETU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHANGJIETU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHANGJIETU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHANGJIETU_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing; refusing to publish an APK signed with the debug key."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/changjietu-release.jks"
          echo "CHANGJIETU_RELEASE_STORE_FILE=$RUNNER_TEMP/changjietu-release.jks" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CHANGJIETU_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Release build
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --no-daemon
      - name: Verify signing continuity and prepare SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.2.0 --pattern "changjietu-0.2.0-release.apk" --dir "$RUNNER_TEMP"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          old_cert=$("$signer" verify --print-certs "$RUNNER_TEMP/changjietu-0.2.0-release.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [[ -z "$old_cert" || "$old_cert" != "$new_cert" ]]; then
            echo "::error::Signing certificate differs from v0.2.0; refusing to publish incompatible update."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk changjietu-0.2.1-release.apk
          sha256sum changjietu-0.2.1-release.apk > changjietu-0.2.1-release.apk.sha256
      - name: Publish APK and SHA-256 only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.1 \
            changjietu-0.2.1-release.apk \
            changjietu-0.2.1-release.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "changjietu 0.2.1" \
            --notes "Compact result actions, collapsible overview, and editor toolbar improvements. Verified with tests and the v0.2.0 signing certificate."
